[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge"
version = "0.2.0"
description = "Python bridge for Overkill AI coding agent"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.80.0",
    "protobuf>=6.31.1",
    "numpy>=1.26.0",
    "grpcio-health-checking>=1.80.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
]

[project.scripts]
overkill-bridge = "server:main"

[project.optional-dependencies]
ml = ["sentence-transformers>=5.5.1"]
dev = [
    "grpcio-tools>=1.80.0",
    "build>=1.2.0",
    "pytest>=8.0",
    "pytest-timeout>=2.3.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "mypy>=1.8",
]
qdrant = [
    "qdrant-client>=1.18.0",
]

[tool.setuptools]
py-modules = ["server", "overkill_pb2", "overkill_pb2_grpc", "model_runtime"]
packages = ["memory", "embeddings", "reranking", "compaction", "proto"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
exclude = ["proto/", "overkill_pb2.py", "overkill_pb2_grpc.py", "overkill_pb2.pyi", "overkill_pb2_grpc.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = true
