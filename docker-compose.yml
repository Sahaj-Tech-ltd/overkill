services:
  overkill:
    build: .
    environment:
      DATABASE_URL: postgres://overkill:${OVERKILL_POSTGRES_PASSWORD:?Set OVERKILL_POSTGRES_PASSWORD}@postgres:5432/overkill?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/workspace
      - overkill-data:/home/overkill/.overkill
    working_dir: /workspace
    stdin_open: true
    tty: true

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: overkill
      POSTGRES_PASSWORD: ${OVERKILL_POSTGRES_PASSWORD:?Set OVERKILL_POSTGRES_PASSWORD}
      POSTGRES_DB: overkill
    ports:
      - "127.0.0.1:${OVERKILL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overkill -d overkill"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  overkill-data:
  postgres-data:
