name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: useblacksmith/checkout@v1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          OUT="dist/overkill-${GOOS}-${GOARCH}"
          [ "$GOOS" = "windows" ] && OUT="${OUT}.exe"
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o "$OUT" \
            ./cmd/overkill

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: overkill-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  checksums:
    needs: release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: overkill-*
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: dist/checksums.txt

  publish:
    needs: checksums
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: overkill-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: checksums
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          python3 scripts/verify-release-assets.py dist
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease+=(--prerelease); fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A reviewed desktop preview may already own this release. Upload
            # CLI assets without publishing its draft or changing its channel.
            gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/overkill-* dist/checksums.txt
          else
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$VERSION" \
              --generate-notes "${prerelease[@]}" \
              dist/overkill-* dist/checksums.txt
          fi
